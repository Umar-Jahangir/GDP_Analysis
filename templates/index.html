<!DOCTYPE html>
<html>
<head>
    <title>GDP Analysis Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>GDP Analysis Tool</h1>
        
        <form id="gdp-form" method="POST" action="/">
            <div class="input-section">
                <div class="form-group">
                    <label>Number of Years:</label>
                    <input type="number" id="year-count" min="2" value="5" onchange="updateFields()">
                </div>
                
                <div id="data-fields">
                    <!-- Dynamic fields will be added here -->
                </div>
                
                <div class="form-group">
                    <label>Inflation Adjustment:</label>
                    <select id="inflation-type">
                        <option value="nominal">Nominal GDP</option>
                        <option value="real">Real GDP (inflation-adjusted)</option>
                    </select>
                </div>
            </div>
            
            <button type="submit">Analyze</button>
        </form>
        
        <div class="comparison-section">
            <h2>Multi-Country Comparison</h2>
            <div class="comparison-controls">
                <select id="country-select" multiple>
                    <option value="india">India</option>
                    <option value="china">China</option>
                    <option value="usa">United States</option>
                </select>
                <button onclick="runComparison()">Compare</button>
            </div>
            <div id="comparison-results"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
